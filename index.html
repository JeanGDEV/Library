<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Library</h1>
    <div class="container-margin">
        <button class="book-btn" onclick="openModal()">Add Book</button>
        <div class="grid-container">
            
        </div>
    </div>
    <dialog>
        <h2>Adding Book...</h2>
        <form action="#" method="post">
            <div class="title-book">
                <label for="title">Title</label>
                <input autofocus type="text" id="title" name="title-book">
            </div>
            <div class="author-book">
                <label for="author">Author</label>
                <input type="text" id="author" name="author-book">
            </div>
            <div class="pages-book">
                <label for="pages">Pages</label>
                <input type="text" id="pages" name="pages-book">
            </div>
            <div class="read-book">
                <label for="read">Was it read?</label>
                <input type="checkbox" name="read-book" id="read">
            </div>
            <div class="form-buttons">
                <button type="button" onclick="closeModal()">Cancel</button>
                <button type="reset">Reset</button>
                <button type="submit" id="submit-btn">Add</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
